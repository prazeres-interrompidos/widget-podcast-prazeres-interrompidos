<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast Prazeres Interrompidos</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}.widget{max-width:380px;margin:auto;padding:16px}.header{text-align:center;margin-bottom:16px}.header h1{margin:0;font-size:20px}.header p{margin:6px 0;font-size:12px;opacity:.65}.episode{background:#1d1d1d;border-radius:16px;padding:12px;margin-bottom:14px}.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.number{margin-top:11px;font-size:12px;font-weight:700;opacity:.65}.title{margin-top:4px;font-size:16px;font-weight:700;line-height:1.3}.date{margin-top:6px;font-size:12px;opacity:.55}audio{width:100%;margin-top:11px;height:38px}.status{text-align:center;padding:25px 10px;font-size:13px;opacity:.7}</style></head><body><div class="widget"><div class="header"><h1>📚 PODCAST PRAZERES INTERROMPIDOS</h1><p>Os últimos episódios</p></div><div id="episodes"><div class="status">A carregar episódios…</div></div></div><script>async function load(){const b=document.getElementById("episodes");try{const r=await fetch("./episodes.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const a=await r.json();if(!a.length){b.innerHTML='<div class="status">Ainda não existem episódios disponíveis.</div>';return}b.innerHTML="";a.slice(0,5).forEach(e=>{const x=document.createElement("article");x.className="episode";if(e.image){const i=document.createElement("img");i.className="cover";i.src=e.image;i.alt=e.title||"";i.loading="lazy";x.appendChild(i)}const n=document.createElement("div");n.className="number";n.textContent=e.episode?"EPISÓDIO "+e.episode:"EPISÓDIO";x.appendChild(n);const t=document.createElement("div");t.className="title";t.textContent=e.title||"";x.appendChild(t);const d=document.createElement("div");d.className="date";const dt=new Date(e.date);d.textContent=isNaN(dt)?"":dt.toLocaleDateString("pt-PT");x.appendChild(d);if(e.audio){const au=document.createElement("audio");au.controls=true;au.preload="none";au.src=e.audio;x.appendChild(au)}b.appendChild(x)})}catch(e){b.innerHTML='<div class="status">Não foi possível carregar os episódios neste momento.</div>'}}load();</script></body></html>
