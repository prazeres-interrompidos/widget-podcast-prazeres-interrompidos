<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Prazeres Interrompidos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
.widget{width:100%;max-width:380px;margin:auto;padding:16px}
.header{text-align:center;margin-bottom:14px}
.header h1{margin:0;font-size:19px;line-height:1.2}
.header p{margin:5px 0 0;font-size:12px;opacity:.6}
.episode{background:#1d1d1d;border-radius:16px;padding:12px}
.cover{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#292929}
.number{margin-top:10px;font-size:11px;font-weight:700;opacity:.62}
.title{margin-top:4px;font-size:16px;font-weight:700;line-height:1.3}
.date{margin-top:5px;font-size:12px;opacity:.52}
audio{width:100%;margin-top:10px;height:38px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.nav button{border:0;border-radius:9px;padding:9px 11px;background:#303030;color:#fff;font-size:13px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.counter{font-size:12px;opacity:.65;white-space:nowrap}
.all{display:block;text-align:center;margin-top:13px;font-size:13px;font-weight:700;color:#fff;text-decoration:none;opacity:.85}
.all:hover{opacity:1}
.status{text-align:center;padding:25px 10px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <h1>📚 PODCAST PRAZERES INTERROMPIDOS</h1>
    <p>Os 10 episódios mais recentes</p>
  </div>

  <div id="episodes"><div class="status">A carregar episódios…</div></div>
</div>

<script>
const DATA_URL="./episodes.json";
const LIMIT=10;
const ALL_EPISODES_URL="https://www.prazeresinterrompidos.pt/";

let episodes=[];
let current=0;

function formatDate(value){
  if(!value)return "";
  const d=new Date(value);
  return Number.isNaN(d.getTime()) ? "" :
    d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function render(){
  const box=document.getElementById("episodes");
  if(!episodes.length){
    box.innerHTML='<div class="status">Ainda não existem episódios disponíveis.</div>';
    return;
  }

  const e=episodes[current];

  box.innerHTML="";

  const article=document.createElement("article");
  article.className="episode";

  if(e.image){
    const img=document.createElement("img");
    img.className="cover";
    img.src=e.image;
    img.alt=e.title || "Capa do episódio";
    article.appendChild(img);
  }

  const number=document.createElement("div");
  number.className="number";
  number.textContent=e.episode ? "EPISÓDIO "+e.episode : "EPISÓDIO";
  article.appendChild(number);

  const title=document.createElement("div");
  title.className="title";
  title.textContent=e.title || "";
  article.appendChild(title);

  const date=document.createElement("div");
  date.className="date";
  date.textContent=formatDate(e.date);
  article.appendChild(date);

  if(e.audio){
    const audio=document.createElement("audio");
    audio.controls=true;
    audio.preload="none";
    audio.src=e.audio;
    audio.setAttribute("aria-label","Ouvir "+(e.title||"episódio"));
    article.appendChild(audio);
  }

  const nav=document.createElement("div");
  nav.className="nav";

  const previous=document.createElement("button");
  previous.textContent="‹ Anterior";
  previous.disabled=current===0;
  previous.onclick=()=>{current--;render()};

  const counter=document.createElement("span");
  counter.className="counter";
  counter.textContent=(current+1)+" / "+episodes.length;

  const next=document.createElement("button");
  next.textContent="Próximo ›";
  next.disabled=current===episodes.length-1;
  next.onclick=()=>{current++;render()};

  nav.append(previous,counter,next);
  article.appendChild(nav);

  const all=document.createElement("a");
  all.className="all";
  all.href=ALL_EPISODES_URL;
  all.target="_blank";
  all.rel="noopener";
  all.textContent="📚 Ver todos os episódios →";
  article.appendChild(all);

  box.appendChild(article);
}

async function load(){
  const box=document.getElementById("episodes");
  try{
    const response=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("episodes.json indisponível");
    const data=await response.json();
    episodes=Array.isArray(data)?data.slice(0,LIMIT):[];
    current=0;
    render();
  }catch(error){
    console.error(error);
    box.innerHTML='<div class="status">Não foi possível carregar os episódios neste momento.</div>';
  }
}
load();
</script>
</body>
</html>
