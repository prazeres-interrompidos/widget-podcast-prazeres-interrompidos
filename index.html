<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Prazeres Interrompidos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.widget {
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    padding: 16px;
}

.header {
    text-align: center;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.2;
}

.header p {
    margin: 6px 0 0;
    font-size: 12px;
    opacity: .65;
}

.episode {
    background: #1d1d1d;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 14px;
}

.cover {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    background: #292929;
}

.episode-number {
    margin-top: 11px;
    font-size: 12px;
    font-weight: 700;
    opacity: .65;
}

.title {
    margin-top: 4px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
}

.date {
    margin-top: 6px;
    font-size: 12px;
    opacity: .55;
}

audio {
    width: 100%;
    margin-top: 11px;
    height: 38px;
}

.loading,
.error {
    text-align: center;
    padding: 25px 10px;
    font-size: 13px;
    opacity: .7;
}

.error {
    color: #ffb5b5;
}
</style>
</head>

<body>

<div class="widget">

    <div class="header">
        <h1>📚 PODCAST PRAZERES INTERROMPIDOS</h1>
        <p>Os últimos episódios</p>
    </div>

    <div id="episodes">
        <div class="loading">A carregar episódios…</div>
    </div>

</div>

<script>
const RSS_URL = "https://anchor.fm/s/9fd320a8/podcast/rss";
const EPISODES_TO_SHOW = 5;

/*
 * O navegador pode bloquear a leitura directa do RSS por CORS.
 * O proxy abaixo permite que o protótipo seja testado.
 * Na versão definitiva podemos colocar um proxy próprio,
 * para que o widget não dependa deste serviço.
 */
const RSS_PROXY =
    "https://api.allorigins.win/raw?url=" +
    encodeURIComponent(RSS_URL);

function escapeHTML(value) {
    return String(value || "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

function textFrom(item, selector) {
    const element = item.querySelector(selector);
    return element ? element.textContent.trim() : "";
}

function getImage(item) {
    const itunesImage = item.querySelector("image");
    if (itunesImage) {
        const href = itunesImage.getAttribute("href");
        if (href) return href;
    }

    const enclosure = item.querySelector("enclosure");
    if (enclosure) {
        const type = enclosure.getAttribute("type") || "";
        const url = enclosure.getAttribute("url") || "";
        if (type.startsWith("image/")) return url;
    }

    return "";
}

function formatDate(dateString) {
    if (!dateString) return "";
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleDateString("pt-PT", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}

async function loadPodcast() {

    const container = document.getElementById("episodes");

    try {

        const response = await fetch(RSS_PROXY, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Não foi possível obter o RSS.");
        }

        const xmlText = await response.text();

        const xml = new DOMParser().parseFromString(
            xmlText,
            "application/xml"
        );

        const items = Array.from(
            xml.querySelectorAll("item")
        ).slice(0, EPISODES_TO_SHOW);

        if (!items.length) {
            throw new Error("Não foram encontrados episódios.");
        }

        container.innerHTML = "";

        items.forEach(function(item) {

            const title = textFrom(item, "title");
            const date = textFrom(item, "pubDate");

            const enclosure = item.querySelector("enclosure");
            const audioURL = enclosure
                ? enclosure.getAttribute("url")
                : "";

            /*
             * No RSS do Spotify/Anchor, a imagem pode estar
             * no elemento itunes:image.
             */
            const imageElement = item.querySelector("image");
            const imageURL = imageElement
                ? imageElement.getAttribute("href") || ""
                : "";

            const episode = document.createElement("article");
            episode.className = "episode";

            if (imageURL) {
                const img = document.createElement("img");
                img.className = "cover";
                img.src = imageURL;
                img.alt = title;
                img.loading = "lazy";
                episode.appendChild(img);
            }

            const number = document.createElement("div");
            number.className = "episode-number";
            number.textContent = "EPISÓDIO";
            episode.appendChild(number);

            const heading = document.createElement("div");
            heading.className = "title";
            heading.textContent = title;
            episode.appendChild(heading);

            const dateElement = document.createElement("div");
            dateElement.className = "date";
            dateElement.textContent = formatDate(date);
            episode.appendChild(dateElement);

            if (audioURL) {
                const audio = document.createElement("audio");
                audio.controls = true;
                audio.preload = "none";
                audio.src = audioURL;
                audio.setAttribute(
                    "aria-label",
                    "Ouvir " + title
                );
                episode.appendChild(audio);
            }

            container.appendChild(episode);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="error">' +
            'Não foi possível carregar os episódios neste momento.' +
            '</div>';
    }
}

loadPodcast();
</script>

</body>
</html>
