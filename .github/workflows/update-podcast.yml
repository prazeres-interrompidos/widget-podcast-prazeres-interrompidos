name: Atualizar episódios do podcast
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar RSS
        run: |
          python3 <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          rss="https://anchor.fm/s/9fd320a8/podcast/rss"
          req=urllib.request.Request(rss,headers={"User-Agent":"Prazeres-Interrompidos-Widget/1.0"})
          data=urllib.request.urlopen(req,timeout=30).read()
          root=ET.fromstring(data)
          ns={"itunes":"http://www.itunes.com/dtds/podcast-1.0.dtd"}
          out=[]
          for item in root.findall("./channel/item"):
              enc=item.find("enclosure")
              img=item.find("itunes:image",ns)
              out.append({
                "episode":(item.findtext("itunes:episode",default="",namespaces=ns) or "").strip(),
                "title":(item.findtext("title") or "").strip(),
                "date":(item.findtext("pubDate") or "").strip(),
                "audio":enc.get("url","").strip() if enc is not None else "",
                "image":img.get("href","").strip() if img is not None else ""
              })
          Path("episodes.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Episódios:",len(out))
          PY
      - name: Commit
        run: |
          git config user.name "Prazeres Interrompidos Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar episódios do podcast"
          git push
